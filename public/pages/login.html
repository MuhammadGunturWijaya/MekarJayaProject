<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mekar Jaya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 25%, #2563eb 50%, #3b82f6 75%, #60a5fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Popup */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
        }

        .popup.active {
            visibility: visible;
            opacity: 1;
        }

        .popup-content {
            background: white;
            padding: 40px 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .checkmark {
            font-size: 60px;
            color: #22c55e;
            margin-bottom: 15px;
        }

        .popup-content h2 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .popup-content p {
            color: #475569;
        }

        /* Error Style */
        .popup.error .popup-content {
            border-top: 5px solid #ef4444;
        }

        .error-icon {
            font-size: 60px;
            color: #ef4444;
            margin-bottom: 15px;
        }

        .close-btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .close-btn:hover {
            background: #dc2626;
        }

        /* Login Container */
        .login-container {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.95));
            border-radius: 30px;
            padding: 50px 45px;
            width: 450px;
            max-width: 90%;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.3) inset,
                0 10px 30px rgba(59, 130, 246, 0.3);
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Decorative Corner Elements */
        .login-container::before,
        .login-container::after {
            content: '🌊';
            position: absolute;
            font-size: 40px;
            opacity: 0.1;
        }

        .login-container::before {
            top: 15px;
            left: 15px;
            transform: rotate(-15deg);
        }

        .login-container::after {
            bottom: 15px;
            right: 15px;
            transform: rotate(15deg);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .logo-icon {
            font-size: 80px;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 5px 15px rgba(0, 102, 204, 0.3));
        }

        h1 {
            color: #1e40af;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 35px;
            font-size: 15px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            color: #1e293b;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            background: #f8fafc;
            color: #1e293b;
        }

        input:hover {
            border-color: #cbd5e1;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow:
                0 0 0 4px rgba(59, 130, 246, 0.1),
                0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 45px;
            font-size: 20px;
        }

        .forgot-password {
            text-align: right;
            margin-top: 12px;
        }

        .forgot-password a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1e40af 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: box-shadow 0.3s, background 0.3s;
            box-shadow:
                0 8px 20px rgba(59, 130, 246, 0.4),
                0 2px 8px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            box-shadow:
                0 12px 30px rgba(59, 130, 246, 0.5),
                0 4px 12px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 50%, #1e3a8a 100%);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

        .register-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, #e2e8f0, transparent);
        }

        .divider span {
            padding: 0 20px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.95));
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-top: 15px;
            font-size: 14px;
            color: #475569;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            padding: 0;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 28px;
            }

            .logo-icon {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="logo">
            <span class="logo-icon">🎣</span>
            <h1>Mekar Jaya</h1>
            <p class="subtitle">Selamat datang kembali! Masuk untuk melanjutkan</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nama@email.com" required>
                <span class="input-icon">📧</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password Anda" required>
                <span class="input-icon">🔒</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember" style="margin: 0; font-weight: 500;">Ingat Saya</label>
                </div>
                <div class="forgot-password" style="margin: 0;">
                    <a href="lupa_password.html">Lupa password?</a>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginberhasil">🎣 Masuk Sekarang</button>

            <div class="divider">
                <span>atau</span>
            </div>

            <div class="register-link">
                Belum punya akun? <a href="register.html">Daftar Sekarang</a>
            </div>
        </form>
    </div>

    <!-- Success Popup -->
    <div id="successPopup" class="popup">
        <div class="popup-content">
            <div class="checkmark">✔</div>
            <h2>Login Berhasil!</h2>
            <p id="popupMessage">Selamat datang 🎉</p>
        </div>
    </div>

    <!-- Error Popup -->
    <div id="errorPopup" class="popup error">
        <div class="popup-content">
            <div class="error-icon">✖</div>
            <h2>Login Gagal!</h2>
            <p id="errorMessage">Email atau password salah</p>
            <button onclick="closeErrorPopup()" class="close-btn">Coba Lagi</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const adminEmail = "admin@gmail.com";
            const adminPassword = "123123";

            const userEmail = "user@gmail.com";
            const userPassword = "123123";

            const successPopup = document.getElementById("successPopup");
            const popupMessage = document.getElementById("popupMessage");

            const errorPopup = document.getElementById("errorPopup");
            const errorMessage = document.getElementById("errorMessage");

            function showSuccess(message, redirectUrl) {
                popupMessage.textContent = message;
                successPopup.classList.add("active");
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 2000);
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorPopup.classList.add("active");
            }

            if (email === adminEmail && password === adminPassword) {
                showSuccess("Login berhasil sebagai Admin 🎉", "../dashboard/admin/dashboard.html");
            } else if (email === userEmail && password === userPassword) {
                showSuccess("Login berhasil sebagai User 🎉", "../dashboard/user/kasir.html");
            } else {
                showError("❌ Email atau Password salah!");
            }
        });

        function closeErrorPopup() {
            document.getElementById("errorPopup").classList.remove("active");
        }
    </script>
</body>

</html>
